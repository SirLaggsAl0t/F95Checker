services:
  f95checker:
    build:
      context: .
    ports:
      - "${CLIENT_PORT:-5173}:${CLIENT_PORT:-5173}"
    volumes:
      - f95checker-data:/data
    environment:
      CLIENT_PORT: ${CLIENT_PORT:-5173}
      F95WEB_USERNAME: ${F95WEB_USERNAME:-}
      F95WEB_PASSWORD: ${F95WEB_PASSWORD:-}
      F95INDEXER_URL: ${F95INDEXER_URL:-}
    restart: unless-stopped

volumes:
  f95checker-data:
